<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rody Maker — prototype d’interaction</title>
<style>
:root { color-scheme:dark; --orange:#ed992d; --ink:#392516; --line:#6a281f; --paper:#e7dba8; --green:#81a944; }
*{box-sizing:border-box} body{margin:0;background:#242521;color:#ddd5bc;font:14px ui-monospace,SFMono-Regular,Consolas,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}
header,footer{width:min(1280px,calc((100vh - 132px)*1.6),100%);display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:12px} header strong{color:#f3e4b8;font-weight:500;letter-spacing:2px} header span,footer{color:#b0b09e} a{color:inherit}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.38;cursor:default}button:focus-visible,[tabindex]:focus-visible{outline:3px solid white;outline-offset:-4px}button{touch-action:manipulation} .outside{border:0;background:none;color:#bbbba8;padding:3px;text-decoration:underline}
#game{width:min(1280px,calc((100vh - 132px)*1.6),100%);aspect-ratio:8/5;background:var(--orange);border:5px solid #171a14;box-shadow:0 0 0 2px #9b743c;position:relative;container-type:inline-size;color:var(--ink);overflow:hidden}
#top{height:35%;display:flex;border-bottom:4px solid #171a14;gap:3px;padding:2px 2px 0} #panel{position:relative;flex:1;min-width:0;border:3px solid var(--line);display:flex;flex-direction:column;background:var(--orange);padding:1cqw 1.6cqw .55cqw;gap:.55cqw}
#sceneTitle{font-size:2.1cqw;line-height:1.08;text-transform:uppercase;letter-spacing:.08em;text-align:center;margin:0;border:0;background:transparent;font-weight:800;color:var(--ink);min-height:2.4cqw;max-height:4.7cqw;overflow:auto;width:100%;padding:.2cqw}
.editable{cursor:text} .editable:hover{outline:1px dashed #69492b;outline-offset:2px}#passageText{flex:1;min-height:0;margin:0;border:0;padding:.3cqw 0;background:transparent;color:var(--ink);font-size:2.1cqw;font-weight:650;line-height:1.18;white-space:pre-wrap;text-align:center;display:flex;align-items:center;justify-content:center;width:100%;overflow:auto}#passageText span{margin:auto;max-height:100%}#passageText.empty{opacity:.6;font-style:italic}
#textEditor{width:100%;flex:1;min-height:0;resize:none;background:#f4b457;border:2px dashed #704126;color:var(--ink);font-size:2.1cqw;line-height:1.18;text-align:center;padding:.6cqw}#titleEditor{width:100%;font-size:2.1cqw;text-align:center;background:#f4b457;border:2px dashed #704126;color:var(--ink)}[hidden]{display:none!important}
#passages{display:flex;align-items:center;justify-content:center;gap:1.3cqw;flex-shrink:0;min-height:2.4cqw} .group{display:flex;gap:.35cqw;align-items:center}.group-label{font-size:.95cqw;letter-spacing:.04em;margin-right:.4cqw;font-weight:bold}.passage{background:transparent;border:1px solid #b36d24;font-size:1.3cqw;color:var(--ink);min-width:2.55cqw;height:2.25cqw;line-height:1;padding:0}.passage.active{background:var(--ink);color:#ffdb85;border-color:var(--ink);box-shadow:0 2px 0 #ffdb85}.passage:hover{border-color:var(--ink)}.passage.unused{border-style:dashed}
#tools{width:27.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:3px;flex-shrink:0}#game.context #tools{width:18.5%;grid-template-columns:repeat(2,1fr)}.tool{border:3px solid var(--line);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7cqw;padding:.3cqw;min-width:0;position:relative}.tool .symbol{font:700 3.5cqw/1 ui-monospace,monospace}.tool .label{font-size:.85cqw;font-weight:bold;letter-spacing:.08em}.tool:hover:not(:disabled){background:#f9eac0;border-color:#e5bc61;box-shadow:inset 0 0 0 2px var(--line)}.tool.primary{background:#94b963}.tool.warning{background:#d5b399}.tool.on{background:#8bbcbc}.tool .dirty{position:absolute;width:.7cqw;height:.7cqw;background:#a7352b;top:.4cqw;right:.4cqw}
#picture{height:65%;position:relative;background:#72a4a6;user-select:none;touch-action:none}#picture svg{display:block;width:100%;height:100%}#picture.drawing{cursor:crosshair}#picture.playing{cursor:crosshair}.zone{vector-effect:non-scaling-stroke;stroke-width:2}.near{fill:#efc952;fill-opacity:.15;stroke:#ffe290;stroke-dasharray:5 4;pointer-events:none}.target{fill:#88d94d;fill-opacity:.3;stroke:#d6ff9b;cursor:crosshair}#zoneLabel{font-size:3px;fill:#162519;paint-order:stroke;stroke:#d6ff9b;stroke-width:1px;pointer-events:none}#pictureHint{position:absolute;top:1cqw;left:1cqw;max-width:90%;font-size:1.15cqw;background:#252a24e8;color:#f2e7bd;padding:.7cqw 1cqw;pointer-events:none;border:1px solid #778778}#toast{position:absolute;bottom:1cqw;left:50%;transform:translateX(-50%);background:#222a22;color:#fff1c8;border:2px solid #b9c092;padding:.8cqw 1.5cqw;font-size:1.2cqw;z-index:8;white-space:nowrap;pointer-events:none}
#tooltip{position:absolute;z-index:20;pointer-events:none;background:#252a24;color:#fff0c4;border:1px solid #dfc789;box-shadow:2px 2px #171a14;font-size:1.1cqw;max-width:36cqw;padding:.6cqw .9cqw;line-height:1.4}
#browser{position:absolute;inset:0;background:var(--orange);z-index:2;padding:.8cqw;display:flex;flex-direction:column;gap:.7cqw}#browserHead{display:flex;justify-content:space-between;align-items:center;font-size:1.1cqw;font-weight:bold}#sceneGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.6cqw;overflow-y:auto;flex:1;scrollbar-color:#704e2b #e5b667} .sceneCard{border:2px solid var(--line);background:#d4c793;color:var(--ink);padding:0;display:flex;flex-direction:column;min-height:6.9cqw}.sceneCard.chosen{border-color:#fff4cb;box-shadow:inset 0 0 0 2px #293d26}.sceneCard svg{width:100%;height:4.6cqw;display:block}.sceneCard span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:.8cqw;padding:.35cqw;text-align:left}.small{background:var(--paper);border:1px solid var(--line);padding:.4cqw .7cqw;color:var(--ink);font-size:1cqw}
#overlay{position:absolute;inset:0;background:#15201cc9;z-index:10;display:flex;align-items:center;justify-content:center}#dialog{background:var(--paper);border:4px solid var(--line);box-shadow:0 0 0 3px #e5a149;width:77%;max-height:93%;padding:2cqw;display:flex;flex-direction:column;gap:1cqw;overflow:auto;font-size:1.25cqw}#dialog h2{margin:0;font-size:1.7cqw}#dialog p{margin:0;line-height:1.5}.fields{display:grid;gap:.8cqw}#dialog label{display:flex;flex-direction:column;gap:.4cqw}#dialog textarea,#dialog input[type=text],#dialog select{background:#f8edce;color:var(--ink);border:2px solid #8b754b;padding:.7cqw;font-size:1.25cqw;resize:vertical}#dialog textarea{min-height:5cqw}#dialog .muted{font-size:1cqw;color:#705f47}#dialog .actions{display:flex;justify-content:flex-end;gap:.7cqw;margin-top:.6cqw}#dialog button{padding:.65cqw 1cqw;font-size:1.15cqw;border:2px solid var(--line);color:var(--ink);background:#f4e8c5}#dialog button.accept{background:#99bd72}#dialog .speaker-line{display:flex;align-items:center;gap:1cqw}
.padding-control{grid-column:1;grid-row:1 / 3;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.2cqw;border:3px solid var(--line);background:var(--paper)}.padding-control label{font-size:.85cqw;font-weight:bold}.padding-stepper{display:flex;flex-direction:column;align-items:center;gap:.8cqw}.padding-stepper button{width:4cqw;height:3.5cqw;font-size:2.3cqw;border:2px solid var(--line);background:#f7e7b7;color:var(--ink);line-height:1}.padding-stepper output{font-size:1.9cqw;font-weight:bold}.padding-control small{font-size:.8cqw}.tool.accept-zone{grid-column:2;grid-row:1}.tool.cancel-zone{grid-column:2;grid-row:2}
#game.playtest #sceneTitle,#game.playtest #passageText{opacity:1;cursor:default}#game.playtest .editable:hover{outline:none}
#imagePanel{position:absolute;inset:0;background:var(--orange);padding:1.2cqw;display:flex;flex-direction:column;gap:1cqw}#imagePanel h2{margin:0;font-size:1.6cqw}#imagePanel p{font-size:1.3cqw;margin:auto;text-align:center;line-height:1.6}.frame-grid{display:flex;gap:1cqw;min-height:0;flex:1}.frame-card{flex:1;min-width:0;display:flex;flex-direction:column;gap:.5cqw}.frame-import{flex:1;min-height:0;background:#d3c391;border:2px solid var(--line);color:var(--ink);font-size:1.3cqw;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.5cqw}.frame-import svg{width:100%;min-height:0;flex:1;object-fit:contain;image-rendering:pixelated}.frame-card .small{flex-shrink:0}.main-preview{max-height:9cqw;max-width:90%;object-fit:contain;align-self:center;image-rendering:pixelated}
@media(max-width:700px){body{padding:8px;justify-content:flex-start;padding-top:25px}header,footer{font-size:10px;width:100%}header{align-items:flex-start}header span{max-width:40%;text-align:right}#game{width:100%;border-width:3px}#top{gap:1px;border-bottom-width:2px}#panel,.tool{border-width:1px}#tools{gap:1px}footer{flex-wrap:wrap}#dialog{width:92%;font-size:1.6cqw}#dialog button,#dialog textarea,#dialog input{font-size:1.6cqw}}
</style>
</head>
<body>
<header><strong>RODY MAKER / ÉTUDE D’INTERACTION</strong><span>Prototype jetable · formes et voix provisoires</span></header>
<main id="game" aria-label="Prototype Rody Maker">
 <section id="top">
  <div id="panel">
   <button id="sceneTitle" class="editable" data-tip="Modifier le titre de cette scène"></button>
   <input id="titleEditor" aria-label="Titre de la scène" hidden>
   <button id="passageText" class="editable" data-tip="Modifier ce texte et sa voix"><span></span></button>
   <textarea id="textEditor" aria-label="Texte affiché du passage" spellcheck="false" hidden></textarea>
   <nav id="passages" aria-label="Passages de la scène"></nav>
   <section id="imagePanel" aria-label="Images de la scène" hidden></section>
   <section id="browser" aria-label="Choisir une scène" hidden><div id="browserHead"><span>CHOISIR UNE SCÈNE</span><button class="small" id="addScene">+ SCÈNE</button></div><div id="sceneGrid"></div></section>
  </div>
  <nav id="tools" aria-label="Outils"></nav>
 </section>
 <section id="picture" aria-label="Illustration de la scène"><svg id="art" viewBox="0 0 320 130" preserveAspectRatio="none" aria-label="Décor schématique"><g id="landscape"></g><g id="zones"></g></svg><div id="pictureHint" hidden></div></section>
 <div id="toast" role="status" hidden></div><div id="tooltip" role="tooltip" hidden></div>
 <div id="overlay" hidden><section id="dialog" role="dialog" aria-modal="true"></section></div>
</main>
<footer><span id="status">Clique sur un texte, puis essaie un objectif.</span><span><a href="index.html" download="rody-maker-poc.html">Télécharger le prototype HTML</a> · <button id="resetDemo" class="outside">Recommencer la démo</button></span></footer>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clone=x=>structuredClone(x);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const titles=['Dans le phare','Au bord de la rivière','Le drôle de grenier','Le départ','La clairière','La vieille cabane','Une rencontre étrange','Le pont','Le moulin','Retour au village','La grotte','La fête'];
function makeScene(title,index=0){return {title,tone:index%3,frames:[],music:['Silence','Silence'],intro:[{text:index===0?'Les circuits électriques sont coupés. Tout le phare refuse de s’allumer !':index===1?'Merci, Rody ! Tu m’as rendu un grand service. Je vais t’aider à retrouver ton chemin.':'Rody arrive dans un endroit qu’il ne connaît pas encore.',speech:index===0?'Les circuits électriques sont coupés. Tout le phare refuse de s’allumer !':'Rody arrive dans un endroit étrange.',phonemes:'',speaker:'character',pitch:1},{text:'Mastico, tu vois quelque chose qui pourrait nous aider ?',speech:'Mastico, tu vois quelque chose qui pourrait nous aider ?',phonemes:'',speaker:'mastico',pitch:1},{text:'',speech:'',phonemes:'',speaker:'character',pitch:1}],objectives:[{text:'Trouve la petite lampe pour éclairer Rody.',speech:'Trouve la petite lampe pour éclairer Rody.',phonemes:'',padding:8,zone:{x:60,y:37,w:17,h:24}},{text:'Où est cachée la clé ?',speech:'Où est cachée la clé ?',phonemes:'',padding:8,zone:{x:245,y:87,w:15,h:8}},{text:'Retrouve le poisson très discret.',speech:'Retrouve le poisson très discret.',phonemes:'',padding:8,zone:null}]};}
let story=titles.map(makeScene),saved=clone(story),sceneIndex=0,kind='intro',passageIndex=0,mode='home',pendingZone=null,pendingPadding=8,drag=null,dirty=false,toastTimer,modalReturnFocus;
function scene(){return story[sceneIndex]}function passage(){return kind==='intro'?scene().intro[passageIndex]:scene().objectives[passageIndex]}function passageName(){return kind==='intro'?'INTRO · '+(passageIndex+1):['OBJECTIF PRINCIPAL','NEW GAME PLUS','FROMSOFTWARE'][passageIndex]}
function updateDirty(){dirty=JSON.stringify(story)!==JSON.stringify(saved);$('status').textContent=`Scène ${sceneIndex+1}/${story.length} · ${passageName()}${dirty?' · modifications dans le brouillon':''}`;const save=$('tools').querySelector('[data-action="save"]');if(save)save.querySelector('.dirty').hidden=!dirty;}
function button(symbol,label,action,tip,cls='',disabled=false){return `<button class="tool ${cls}" data-action="${action}" data-tip="${esc(tip)}" aria-label="${esc(tip)}" ${disabled?'disabled':''}><span class="symbol" aria-hidden="true">${symbol}</span><span class="label">${label}</span>${action==='save'?'<i class="dirty" '+(!dirty?'hidden':'')+'></i>':''}</button>`}
function renderTools(){let html='';
 if(mode==='home')html=button('♫','MUSIQUE','music','Choisir les musiques de cette scène')+button('▶','TEST','test','Tester cette scène','primary')+button('↓','GARDER','save','Télécharger le brouillon du prototype')+button('▦','SCÈNES','scenes','Choisir une scène')+button('▧','IMAGES','images','Changer l’image et voir les animations')+button('↶','RÉTABLIR','restore','Rétablir toute l’histoire au dernier enregistrement','warning',!dirty);
 else if(mode==='text')html=button('♪','VOIX','voice','Modifier la voix de ce passage')+button('✓','TERMINER','done','Terminer l’édition du texte','primary')+(kind==='intro'?button(passage().speaker==='mastico'?'M':'R',passage().speaker==='mastico'?'MASTICO':'PERSONNAGE','speaker','Changer qui parle : Mastico ou personnage',passage().speaker==='mastico'?'on':''):button('▣','CIBLE','draw','Dessiner la cible de cet objectif'))+button('↩','RETOUR','done','Revenir à la scène en gardant le texte');
 else if(mode==='draw')html=`<div class="padding-control"><label>ZONE PROCHE</label><div class="padding-stepper"><button data-action="morePadding" aria-label="Augmenter la marge">+</button><output aria-label="Marge de proximité">${pendingPadding}</output><button data-action="lessPadding" aria-label="Réduire la marge" ${pendingPadding===0?'disabled':''}>−</button></div><small>pixels autour<br>de la cible</small></div>`+button('✓','VALIDER','acceptZone','Valider la cible et sa marge','primary accept-zone',!pendingZone)+button('×','ANNULER','cancelDraw','Annuler le dessin et la marge','cancel-zone');
 else if(mode==='title')html=button('T','TITRE','noop','Modification du titre','on',true)+button('✓','TERMINER','done','Terminer l’édition du titre','primary')+button('↩','RETOUR','done','Revenir à la scène en gardant le titre')+button('','', 'noop','', '',true);
 else if(mode==='scenes')html=button('▦','SCÈNES','noop','Choisir une scène','on',true)+button('↩','RETOUR','closeScenes','Fermer le navigateur de scènes')+button('←','PRÉC.','previousScene','Scène précédente','',sceneIndex===0)+button('→','SUIV.','nextScene','Scène suivante','',sceneIndex===story.length-1);
 else if(mode==='images')html=button('↓','IMPORTER','importMain','Importer l’image principale (simulation)')+button('↩','RETOUR','done','Revenir à la scène')+button('1–3','ANIMATION','frames1','Images d’animation 1 à 3')+button('4–6','ANIMATION','frames2','Images d’animation 4 à 6','',scene().frames.length<3);
 else if(mode==='frames')html=button('↓','IMPORTER','importNextFrame','Ajouter la prochaine image d’animation','',scene().frames.length>=6)+button('↩','RETOUR','images','Revenir aux outils Images')+button('←','1–3','frames1','Images d’animation 1 à 3','',frameOffset===0)+button('→','4–6','frames2','Images d’animation 4 à 6','',frameOffset===3||scene().frames.length<3);
 else if(mode==='test')html=button('M',kind==='objective'&&passageIndex===0?'NG+':'FSW','bonus','Essayer l’objectif plus difficile','',kind!=='objective'||!testFound||passageIndex===2)+button('→','SUITE','advanceGame',kind==='intro'?'Continuer l’introduction':'Continuer l’histoire','primary',kind==='objective'&&!testFound)+button('♪','RÉÉCOUTER','listen','Réécouter le dialogue ou l’indice')+button('▧','ÉDITER','endTest','Retourner dans Maker au passage de travail');
 $('tools').innerHTML=html;
}
function render(){
 updateDirty();
 $('tooltip').hidden=true;$('game').classList.toggle('context',mode!=='home');$('game').classList.toggle('playtest',mode==='test');
 $('sceneTitle').textContent=scene().title||'Ajouter un titre';$('sceneTitle').hidden=mode==='title'||['scenes','images','frames'].includes(mode);$('sceneTitle').disabled=mode==='draw'||mode==='test'||mode==='scenes';
 $('titleEditor').hidden=mode!=='title';if(mode==='title')$('titleEditor').value=scene().title;
 $('passageText').hidden=mode==='text'||['scenes','images','frames'].includes(mode);$('textEditor').hidden=mode!=='text';if(mode==='text')$('textEditor').value=passage().text;
 $('passageText').querySelector('span').textContent=passage().text||(mode==='test'?'(Passage vide)':kind==='intro'?'Cliquer pour écrire cette réplique…':'Cliquer pour écrire cet indice…');$('passageText').classList.toggle('empty',!passage().text);$('passageText').disabled=mode==='draw'||mode==='test'||mode==='scenes';
 $('passages').hidden=['scenes','images','frames','test'].includes(mode);
 $('passages').innerHTML=['intro','objective'].map(group=>`<div class="group"><span class="group-label">${group==='intro'?'INTRO':'OBJETS'}</span>${[0,1,2].map(i=>`<button class="passage ${group===kind&&i===passageIndex?'active':''} ${!(group==='intro'?scene().intro:scene().objectives)[i].text?'unused':''}" data-kind="${group}" data-index="${i}" aria-label="${group==='intro'?'Introduction '+(i+1):['Objectif principal','Objectif New Game Plus','Objectif FromSoftware'][i]}" aria-pressed="${group===kind&&i===passageIndex}" data-tip="${group==='intro'?'Réplique '+(i+1):['Objectif principal','New Game Plus','FromSoftware'][i]}" ${mode==='draw'||mode==='scenes'?'disabled':''}>${i+1}</button>`).join('')}</div>`).join('');
 $('browser').hidden=mode!=='scenes';if(mode==='scenes')renderBrowser();renderTools();renderArt();renderZones();$('imagePanel').hidden=!['images','frames'].includes(mode);if(!$('imagePanel').hidden)renderImages();
 const hint=mode==='draw'?'Dessine la cible. La zone proche suit. ✓ pour garder · Échap pour annuler.':mode==='test'?'':(mode==='home'||mode==='text')&&kind==='objective'?'Fais glisser dans le décor pour dessiner la cible.':'';
 $('pictureHint').textContent=hint;$('pictureHint').hidden=!hint;$('picture').className=mode==='draw'?'drawing':mode==='test'?'playing':(mode==='home'||mode==='text')&&kind==='objective'?'drawing':'';
}
function artMarkup(tone){const water=['#537f87','#759a7a','#7b7594'][tone];return `<rect width="320" height="130" fill="${water}"/><path d="M0 85 L210 130 H0Z" fill="#8b7354"/><path d="M230 48L320 37V130H150Z" fill="#c5ac73"/><path d="M0 82L130 114M10 94L87 117M201 109L311 56M208 120L315 75" stroke="#9a8152" stroke-width="1"/><path d="M100 10H120M148 33H170M197 13H213M111 67H129M165 79H187M242 23H270" stroke="#a9c6be" stroke-width="1.5"/><rect x="15" width="3" height="94" fill="#493b30"/><rect x="99" width="3" height="111" fill="#493b30"/><rect x="232" width="3" height="130" fill="#493b30"/><rect y="24" width="320" height="3" fill="#493b30"/><rect x="22" y="66" width="58" height="30" fill="#6c583f" stroke="#3f382a"/><path d="M22 71H80M22 89H80" stroke="#a18b60"/><rect x="61" y="55" width="15" height="5" fill="#354139"/><rect x="67" y="47" width="3" height="10" fill="#354139"/><path d="M65 37H72L77 49H60Z" fill="#f0d17d" stroke="#554830"/><circle cx="46" cy="43" r="8" fill="#dcc49c"/><path d="M36 53H53L58 76H32Z" fill="#8a4b3b"/><path d="M37 75V96M50 75V96" stroke="#353e43" stroke-width="6"/><rect x="264" y="99" width="39" height="24" fill="#a87352" stroke="#5e4b37"/><path d="M264 99L303 123M303 99L264 123" stroke="#5e4b37"/><circle cx="249" cy="91" r="3" fill="none" stroke="#f0d37d" stroke-width="1.5"/><path d="M252 91H259M257 91V94" stroke="#f0d37d" stroke-width="1.5"/><path d="M175 51q5 -4 10 0q-5 4 -10 0L172 48V54Z" fill="#bac6b2"/><text x="8" y="124" font-family="monospace" font-size="3.5" fill="#302d24">DÉCOR ${tone+1} · LAMPE / CLÉ / POISSON</text>`;}
function renderArt(){const tone=mode==='frames'&&previewFrame!==null?scene().frames[previewFrame]:scene().tone;$('landscape').innerHTML=artMarkup(tone)}
function padded(z,margin){const x=Math.max(0,z.x-margin),y=Math.max(0,z.y-margin);return{x,y,w:Math.min(320,z.x+z.w+margin)-x,h:Math.min(130,z.y+z.h+margin)-y}}
function renderZones(){let z=mode==='draw'?pendingZone:kind==='objective'?passage().zone:null;if(!['home','text','draw'].includes(mode))z=null;if(!z){$('zones').innerHTML='';return;}const n=padded(z,mode==='draw'?pendingPadding:passage().padding);$('zones').innerHTML=`<rect class="zone near" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}"/><rect class="zone target" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}"/><text id="zoneLabel" x="${z.x}" y="${Math.max(4,z.y-2)}">CIBLE ${passageIndex+1}</text>`;}
function renderBrowser(){$('sceneGrid').innerHTML=story.map((s,i)=>`<button class="sceneCard ${i===sceneIndex?'chosen':''}" data-scene="${i}" aria-label="Scène ${i+1} : ${esc(s.title)}" aria-current="${i===sceneIndex}"><svg viewBox="0 0 320 130" preserveAspectRatio="none">${artMarkup(s.tone)}</svg><span>${i+1}. ${esc(s.title||'Sans titre')}</span></button>`).join('')}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2800)}
function stopVoice(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function selectPassage(k,i){stopVoice();kind=k;passageIndex=i;if(mode==='title')mode='home';render()}
function openText(){mode='text';render();$('textEditor').focus()}
function openTitle(){mode='title';render();$('titleEditor').focus();$('titleEditor').select()}
function startDraw(){stopVoice();mode='draw';pendingZone=clone(passage().zone);pendingPadding=passage().padding;drag=null;render()}
function endDraw(accept){if(accept&&pendingZone){passage().zone=clone(pendingZone);passage().padding=pendingPadding;updateDirty()}pendingZone=null;drag=null;mode='home';render();if(accept)toast('Cible et zone proche conservées.')}
let testOrigin=null,testFound=false;
function startTest(){testOrigin={sceneIndex,kind,passageIndex};mode='test';kind='intro';passageIndex=0;testFound=false;skipEmptyIntroductions();render();toast('Lecture de la scène · simulation HTML')}
function endTest(){stopVoice();({sceneIndex,kind,passageIndex}=testOrigin);mode='home';render()}
function skipEmptyIntroductions(){while(kind==='intro'&&!passage().text&&!passage().speech){if(passageIndex<2)passageIndex++;else{kind='objective';passageIndex=0}}}
function advanceGame(){stopVoice();if(kind==='intro'){if(passageIndex<2)passageIndex++;else{kind='objective';passageIndex=0}skipEmptyIntroductions()}else if(testFound){if(sceneIndex===story.length-1){endTest();toast('Fin de l’histoire. Retour à ton passage de travail.');return}sceneIndex++;kind='intro';passageIndex=0;skipEmptyIntroductions()}testFound=false;render()}
function changePadding(delta){pendingPadding=Math.max(0,pendingPadding+delta);renderTools();renderZones()}

function speak(text,pitch=1){stopVoice();if(!('speechSynthesis'in window)){toast('Synthèse vocale indisponible dans ce navigateur.');return;}if(!text.trim()){toast('Cette voix est vide.');return;}const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.pitch=pitch;u.rate=.9;u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('Écoute indisponible ici. Le texte reste éditable.')};speechSynthesis.speak(u)}
function openModal(html){modalReturnFocus=document.activeElement;$('tooltip').hidden=true;$('dialog').innerHTML=html;$('overlay').hidden=false;$('top').inert=true;$('picture').inert=true;$('dialog').querySelector('input,textarea,button,select')?.focus()}
function closeModal(){stopVoice();$('overlay').hidden=true;$('top').inert=false;$('picture').inert=false;modalReturnFocus?.focus()}
function voiceModal(){const p=passage(),mastico=kind==='objective'||p.speaker==='mastico';openModal(`<h2>VOIX · ${esc(passageName())}</h2><p class="muted">Texte et voix sont indépendants. Ici, l’écoute utilise la voix du navigateur ; les phonèmes sont un champ de démonstration.</p><label>Texte prononcé<textarea id="voiceText" spellcheck="false">${esc(p.speech)}</textarea></label><label>Phonèmes / corrections (simulation)<input id="voicePhonemes" type="text" value="${esc(p.phonemes)}" placeholder="Écrire une correction pour tester appliquer / annuler"></label><div class="speaker-line"><span>${mastico?'Mastico · hauteur fixe':'Personnage · hauteur'}</span>${mastico?'':`<input id="voicePitch" aria-label="Hauteur de voix" type="range" min="0.5" max="1.8" step="0.1" value="${p.pitch}"><output id="pitchValue">${p.pitch}</output>`}<button id="listenVoice">▶ Écouter</button></div><div class="actions"><button id="cancelVoice">Annuler</button><button id="applyVoice" class="accept">Utiliser ce dialogue</button></div>`);
 $('voicePitch')?.addEventListener('input',()=>$('pitchValue').textContent=$('voicePitch').value);$('listenVoice').onclick=()=>speak($('voiceText').value,Number($('voicePitch')?.value||1));$('cancelVoice').onclick=closeModal;$('applyVoice').onclick=()=>{p.speech=$('voiceText').value;p.phonemes=$('voicePhonemes').value;if(!mastico)p.pitch=Number($('voicePitch').value);closeModal();updateDirty();toast('Voix appliquée à '+passageName().toLowerCase()+'.')};}
function musicModal(){openModal(`<h2>MUSIQUES DE LA SCÈNE</h2><p class="muted">Sélection de démonstration, sans pistes audio.</p>${['Ouverture','Pendant la scène'].map((label,i)=>`<label>${label}<select id="music${i}">${['Silence','Promenade','Mystère','Rivière'].map(x=>`<option ${scene().music[i]===x?'selected':''}>${x}</option>`).join('')}</select></label>`).join('')}<div class="actions"><button id="cancelMusic">Annuler</button><button id="applyMusic" class="accept">Utiliser ces musiques</button></div>`);$('cancelMusic').onclick=closeModal;$('applyMusic').onclick=()=>{scene().music=[$('music0').value,$('music1').value];closeModal();updateDirty();renderTools();toast('Musiques conservées pour cette scène.')};}
let frameOffset=0,previewFrame=null;
function openImages(){mode='images';previewFrame=null;render()}
function openFrames(offset){mode='frames';frameOffset=offset;previewFrame=null;render()}
function renderImages(){if(mode==='images'){$('imagePanel').innerHTML='<h2>IMAGES DE LA SCÈNE</h2><p>Image principale et images d’animation.<br>Importer simule le remplacement de l’image.</p>';return}
 $('imagePanel').innerHTML=`<h2>ANIMATION · IMAGES ${frameOffset+1} À ${frameOffset+3}</h2><div class="frame-grid">${[0,1,2].map(n=>{const i=n+frameOffset,exists=i<scene().frames.length;return `<div class="frame-card"><button class="frame-import" data-frame="${i}" aria-label="${exists?'Remplacer':'Importer'} l’image d’animation ${i+1}" ${i>scene().frames.length?'disabled':''}>${exists?`<svg viewBox="0 0 320 130">${artMarkup(scene().frames[i])}</svg>`:'+'}<span>Image ${i+1}</span></button><button class="small" data-remove="${i}" ${!exists?'disabled':''}>Retirer</button></div>`}).join('')}</div>`;
}
function importImage(frame=null){if(frame===null)scene().tone=(scene().tone+1)%3;else scene().frames[frame]=((scene().frames[frame]??frame)+1)%3;previewFrame=frame;render();toast('Import simulé : image remplacée.')}
$('imagePanel').addEventListener('click',e=>{const frame=e.target.closest('[data-frame]'),remove=e.target.closest('[data-remove]');if(frame&&!frame.disabled)importImage(Number(frame.dataset.frame));if(remove&&!remove.disabled){scene().frames.splice(Number(remove.dataset.remove),1);previewFrame=null;render()}});
$('imagePanel').addEventListener('pointerover',e=>{const frame=e.target.closest('[data-frame]');if(frame&&Number(frame.dataset.frame)<scene().frames.length){previewFrame=Number(frame.dataset.frame);renderArt()}});
$('imagePanel').addEventListener('focusin',e=>{const frame=e.target.closest('[data-frame]');if(frame&&Number(frame.dataset.frame)<scene().frames.length){previewFrame=Number(frame.dataset.frame);renderArt()}});

function confirmModal(title,text,acceptLabel,onAccept){openModal(`<h2>${title}</h2><p>${text}</p><div class="actions"><button id="cancelConfirm">Annuler</button><button id="acceptConfirm" class="accept">${acceptLabel}</button></div>`);$('cancelConfirm').onclick=closeModal;$('acceptConfirm').onclick=()=>{closeModal();onAccept()}}
function save(){const blob=new Blob([JSON.stringify({prototype:'Rody Maker interaction study',story},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rody-maker-prototype.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);saved=clone(story);updateDirty();renderTools();toast('Téléchargement lancé · fichier du prototype.')}
const actions={scenes:()=>{mode='scenes';render()},closeScenes:()=>{mode='home';render()},previousScene:()=>{sceneIndex--;mode='home';render()},nextScene:()=>{sceneIndex++;mode='home';render()},music:musicModal,images:openImages,importMain:()=>importImage(),frames1:()=>openFrames(0),frames2:()=>openFrames(3),importNextFrame:()=>importImage(scene().frames.length),save,restore:()=>confirmModal('RÉTABLIR TOUTE L’HISTOIRE ?', 'Tous les textes, voix, scènes et cibles reviennent au dernier enregistrement de ce prototype.','Rétablir',()=>{story=clone(saved);sceneIndex=Math.min(sceneIndex,story.length-1);render();toast('Toute l’histoire a été rétablie.')}),voice:voiceModal,speaker:()=>{passage().speaker=passage().speaker==='mastico'?'character':'mastico';updateDirty();renderTools()},done:()=>{mode='home';render()},draw:startDraw,morePadding:()=>changePadding(1),lessPadding:()=>changePadding(-1),acceptZone:()=>endDraw(true),cancelDraw:()=>endDraw(false),test:startTest,endTest,listen:()=>speak(passage().speech,kind==='intro'&&passage().speaker==='character'?passage().pitch:1),advanceGame,bonus:()=>{passageIndex++;testFound=false;render()},noop:()=>{}};
$('tools').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)actions[b.dataset.action]()});$('sceneTitle').onclick=openTitle;$('passageText').onclick=openText;
$('textEditor').oninput=()=>{passage().text=$('textEditor').value;updateDirty()};$('titleEditor').oninput=()=>{scene().title=$('titleEditor').value;updateDirty()};$('titleEditor').onkeydown=e=>{if(e.key==='Enter'){mode='home';render()}};
$('passages').onclick=e=>{const b=e.target.closest('[data-kind]');if(b&&!b.disabled)selectPassage(b.dataset.kind,Number(b.dataset.index))};
$('sceneGrid').onclick=e=>{const b=e.target.closest('[data-scene]');if(b){sceneIndex=Number(b.dataset.scene);mode='home';render()}};$('addScene').onclick=()=>{story.push(makeScene('Nouvelle scène',story.length));sceneIndex=story.length-1;scene().intro.forEach(p=>{p.text='';p.speech=''});scene().objectives.forEach(p=>{p.text='';p.speech='';p.zone=null});mode='home';render();openTitle()};
function point(e){const r=$('picture').getBoundingClientRect();return{x:Math.max(0,Math.min(320,(e.clientX-r.left)*320/r.width)),y:Math.max(0,Math.min(130,(e.clientY-r.top)*130/r.height))}}
function inside(p,z){return z&&p.x>=z.x&&p.x<=z.x+z.w&&p.y>=z.y&&p.y<=z.y+z.h}
$('picture').addEventListener('pointerdown',e=>{if(e.button!==0)return;if((mode==='home'||mode==='text')&&kind==='objective')startDraw();if(mode==='draw'){e.preventDefault();drag={start:point(e),previous:clone(pendingZone),id:e.pointerId};$('picture').setPointerCapture(e.pointerId);return;}if(mode==='test'){if(kind==='objective'){const p=point(e),z=passage().zone;if(!z)toast('Cet objectif n’a pas encore de cible.');else if(inside(p,z)){testFound=true;renderTools();toast('Bravo ! Objet trouvé.')}else toast(inside(p,padded(z,passage().padding))?'Tu es tout près…':'Ce n’est pas là. Essaie encore.')}return;}});
$('picture').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const p=point(e),s=drag.start;pendingZone={x:Math.round(Math.min(s.x,p.x)),y:Math.round(Math.min(s.y,p.y)),w:Math.round(Math.abs(p.x-s.x)),h:Math.round(Math.abs(p.y-s.y))};renderZones()});
function finishDrag(e,cancel=false){if(!drag||e.pointerId!==drag.id)return;if(cancel||!pendingZone||pendingZone.w<1||pendingZone.h<1)pendingZone=drag.previous;const id=drag.id;drag=null;if($('picture').hasPointerCapture(id))$('picture').releasePointerCapture(id);renderZones();renderTools()}
$('picture').addEventListener('pointerup',e=>finishDrag(e));$('picture').addEventListener('pointercancel',e=>finishDrag(e,true));
$('resetDemo').onclick=()=>confirmModal('RECOMMENCER LA DÉMO ?', 'Le brouillon du prototype sera remplacé par ses scènes de départ.','Recommencer',()=>{story=titles.map(makeScene);saved=clone(story);sceneIndex=passageIndex=0;kind='intro';mode='home';render()});
document.addEventListener('keydown',e=>{if(!$('overlay').hidden){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const nodes=[...$('dialog').querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='Escape'){e.preventDefault();if(mode==='draw'){if(drag){const id=drag.id;drag=null;if($('picture').hasPointerCapture(id))$('picture').releasePointerCapture(id)}endDraw(false)}else if(mode==='test')endTest();else if(mode==='frames')openImages();else if(mode!=='home'){mode='home';render()}}});
$('game').addEventListener('pointerover',e=>{const target=e.target.closest('[data-tip]');if(!target||!target.dataset.tip||target.disabled||!$('overlay').hidden||drag)return;const r=$('game').getBoundingClientRect(),b=target.getBoundingClientRect();$('tooltip').textContent=target.dataset.tip;$('tooltip').hidden=false;const tr=$('tooltip').getBoundingClientRect();$('tooltip').style.left=Math.max(6,Math.min(b.left-r.left,r.width-tr.width-10))+'px';$('tooltip').style.top=Math.min(r.height-tr.height-10,b.bottom-r.top+6)+'px'});$('game').addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))$('tooltip').hidden=true});
render();
</script>
</body></html>
